[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-eval"
version = "0.1.0"
description = "A lightweight toolkit for evaluating retrieval quality in AI agent memory systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
agent-memory-eval = "agent_memory_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
